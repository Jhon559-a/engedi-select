# Cloud catalog frontend. Database and private storage are configured separately.
services:
  - type: web
    name: engedi-select
    runtime: static
    buildCommand: "true"
    staticPublishPath: ./public
    autoDeployTrigger: off
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cgwhutldpvrpgclphwwp.supabase.co; font-src 'self'; connect-src 'self' https://cgwhutldpvrpgclphwwp.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /
        name: Cache-Control
        value: "no-store"
      - path: /index.html
        name: Cache-Control
        value: "no-store"
      - path: /admin.html
        name: Cache-Control
        value: "no-store"
      - path: /site-config.js
        name: Cache-Control
        value: "no-store"
      - path: /catalog.json
        name: Cache-Control
        value: "no-store"
